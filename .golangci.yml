# golangci-lint v2 configuration. Docs: https://golangci-lint.run/
version: "2"

run:
  timeout: 5m

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose     # HTTP response bodies must be closed
    - errorlint     # use errors.Is / errors.As, not ==
    - gosec         # common security mistakes
    - misspell      # typos in comments and strings
    - noctx         # HTTP/DB calls must carry a context
    - revive        # style (successor of golint)
    - unconvert     # pointless type conversions
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    rules:
      # Tests may ignore some errors and use hard-coded values.
      - path: _test\.go
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt
    - goimports
